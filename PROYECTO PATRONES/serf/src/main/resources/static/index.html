<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SERF · FinanCorp</title>
<style>
:root{--bg:#f5f4f9;--card:#fff;--tx:#1d1b26;--mu:#625e73;--ac:#5b21b6;--bd:#d9d5e8;--ok:#166534;--er:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#16141f;--card:#211e2d;--tx:#ece9f6;--mu:#a8a3bd;--ac:#a78bfa;--bd:#3a3650;--ok:#86efac;--er:#fca5a5}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Georgia,'Times New Roman',serif;background:var(--bg);color:var(--tx)}
header{padding:18px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
header h1{margin:0;font-size:22px}header p{margin:2px 0 0;color:var(--mu);font-size:13px}
nav{display:flex;gap:4px;padding:10px 20px 0;overflow-x:auto}
nav button{font:inherit;padding:8px 16px;border:1px solid var(--bd);border-bottom:0;background:transparent;color:var(--mu);border-radius:6px 6px 0 0;cursor:pointer}
nav button[aria-selected=true]{background:var(--card);color:var(--ac);font-weight:bold}
main{padding:0 20px 40px;max-width:1100px;margin:auto}
section{display:none;background:var(--card);border:1px solid var(--bd);padding:18px;border-radius:0 6px 6px 6px}
section.on{display:block}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px}
input,select,textarea{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)}
button.p{font:inherit;padding:9px 16px;background:var(--ac);color:var(--bg);border:0;border-radius:4px;cursor:pointer;align-self:end}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;white-space:nowrap}
.msg{min-height:22px;margin:6px 0;font-size:14px}.ok{color:var(--ok)}.err{color:var(--er)}
.chk{flex-direction:row;align-items:center;gap:6px}
#rep{margin-top:16px;border:1px solid var(--bd);overflow-x:auto}
</style>
</head>
<body>
<header><h1>SERF · Reportes financieros FinanCorp</h1><p>Moneda corporativa: <span id="mon">EUR</span></p></header>
<main>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-t="productos">Productos</button>
  <button role="tab" aria-selected="false" data-t="ventas">Ventas</button>
  <button role="tab" aria-selected="false" data-t="reportes">Reportes</button>
</nav>

<section id="productos" class="on">
  <form id="fp">
    <label>Código<input name="codigo" required></label>
    <label>Nombre<input name="nombre" required></label>
    <label>Descripción técnica<input name="descripcionTecnica"></label>
    <label>Categoría<select name="categoria" id="cat"></select></label>
    <label>Costo de importación<input name="costoImportacion" type="number" step="0.01" min="0.01" required></label>
    <label>Moneda de origen<input name="monedaOrigen" value="CNY" required></label>
    <label>Precio de venta sugerido<input name="precioSugerido" type="number" step="0.01" min="0.01" required></label>
    <label>Proveedor<input name="proveedor"></label>
    <label>Fecha de importación<input name="fechaImportacion" type="date" required></label>
    <label>Stock inicial<input name="stockInicial" type="number" min="0" required></label>
    <button class="p">Registrar producto</button>
  </form>
  <div id="mp" class="msg" role="status"></div>
  <div class="tw"><table id="tp"></table></div>
</section>

<section id="ventas">
  <form id="fv">
    <label>N.º de factura<input name="numeroFactura" required></label>
    <label>Fecha<input name="fecha" type="date" required></label>
    <label>Producto<select name="codigoProducto" id="sp" required></select></label>
    <label>Cantidad<input name="cantidad" type="number" min="1" required></label>
    <label>Precio unitario (moneda local)<input name="precioUnitario" type="number" step="0.01" min="0.01" required></label>
    <label>Filial<select name="filial" id="sf"></select></label>
    <label>Cliente<input name="cliente" required></label>
    <label>Vendedor<input name="vendedor" required></label>
    <label>Método de pago<select name="metodoPago" id="sm"></select></label>
    <button class="p">Registrar venta</button>
  </form>
  <div id="mv" class="msg" role="status"></div>
  <div class="tw"><table id="tv"></table></div>
</section>

<section id="reportes">
  <form id="fr">
    <label>Tipo<select name="tipo"><option value="MENSUAL">Mensual de ingresos</option><option value="TRIMESTRAL">Trimestral de gastos e ingresos</option><option value="ANUAL">Anual consolidado</option></select></label>
    <label>Año<input name="anio" type="number" required></label>
    <label>Mes (o mes del trimestre)<input name="mes" type="number" min="1" max="12" required></label>
    <label class="chk"><input type="checkbox" name="marca" checked> Marca de agua</label>
    <label class="chk"><input type="checkbox" name="firma" checked> Firma digital</label>
    <button class="p">Generar reporte</button>
  </form>
  <div id="mr" class="msg" role="status"></div>
  <div id="rep"></div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(u,o){const r=await fetch(u,o),t=await r.text();if(!r.ok){let m=t;try{m=JSON.parse(t).error||t}catch{}throw new Error(m)}return t}
const jget=async u=>JSON.parse(await api(u));
const jpost=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const say=(el,t,ok)=>{el.textContent=t;el.className='msg '+(ok?'ok':'err')};
const fill=(sel,items)=>sel.innerHTML=items.map(i=>`<option>${esc(i)}</option>`).join('');
const table=(el,cols,rows)=>el.innerHTML='<tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('');
const hoy=new Date(),iso=hoy.toISOString().slice(0,10);

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
});

async function cargar(){
  const c=await jget('/api/config');
  $('#mon').textContent=c.monedaCorporativa;
  fill($('#cat'),c.categorias);fill($('#sm'),c.metodosPago);
  fill($('#sf'),Object.keys(c.filiales));
  const ps=await jget('/api/productos');
  $('#sp').innerHTML=ps.map(p=>`<option value="${esc(p.codigo)}">${esc(p.codigo)} · ${esc(p.nombre)} (stock ${p.stock})</option>`).join('');
  table($('#tp'),['Código','Nombre','Categoría','Costo origen','Costo EUR','Precio sug.','Proveedor','Importación','Stock'],
    ps.map(p=>[p.codigo,p.nombre,p.categoria,p.costoImportacion+' '+p.monedaOrigen,p.costoImportacionEur,p.precioSugerido,p.proveedor,p.fechaImportacion,p.stock]));
  const vs=await jget('/api/ventas');
  table($('#tv'),['Factura','Fecha','Producto','Cant.','P. unit.','Filial','Cliente','Vendedor','Pago','Total EUR'],
    vs.map(v=>[v.numeroFactura,v.fecha,v.codigoProducto,v.cantidad,v.precioUnitario+' '+v.moneda,v.filial,v.cliente,v.vendedor,v.metodoPago,v.totalEur]));
}
function enviar(form,url,msg,ok){form.onsubmit=async e=>{e.preventDefault();
  try{await jpost(url,Object.fromEntries(new FormData(form)));say(msg,ok,true);form.reset();defaults();await cargar()}
  catch(x){say(msg,x.message,false)}}}
enviar($('#fp'),'/api/productos',$('#mp'),'Producto registrado y costo convertido a la moneda corporativa.');
enviar($('#fv'),'/api/ventas',$('#mv'),'Venta registrada; stock actualizado y total convertido a EUR.');
$('#fr').onsubmit=async e=>{e.preventDefault();const f=e.target;
  const q=new URLSearchParams({tipo:f.tipo.value,anio:f.anio.value,mes:f.mes.value,marca:f.marca.checked,firma:f.firma.checked});
  try{$('#rep').innerHTML=await api('/api/reportes?'+q);say($('#mr'),'Reporte generado.',true)}
  catch(x){say($('#mr'),x.message,false)}};
function defaults(){
  document.querySelector('#fp [name=fechaImportacion]').value=iso;document.querySelector('#fp [name=monedaOrigen]').value='CNY';
  document.querySelector('#fv [name=fecha]').value=iso;
  $('#fr [name=anio]').value=hoy.getFullYear();$('#fr [name=mes]').value=hoy.getMonth()+1}
defaults();cargar().catch(x=>say($('#mp'),x.message,false));
</script>
</body>
</html>
